<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Nudgy: Your deadlines, right on time." xmlns:c2pa="http://c2pa.org/manifest">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFE6DE"/><stop offset=".55" stop-color="#E8E4FF"/><stop offset="1" stop-color="#D9F3E7"/></linearGradient>
<linearGradient id="t" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#E36E57"/><stop offset="1" stop-color="#6F60F0"/></linearGradient>
<linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB4A2"/><stop offset=".55" stop-color="#B3A9FA"/><stop offset="1" stop-color="#7FD3B4"/></linearGradient>
<path id="s" d="M0-14C2-4 4-2 14 0 4 2 2 4 0 14-2 4-4 2-14 0-4-2-2-4 0-14Z"/>
<g id="logo"><rect width="96" height="96" rx="26" fill="url(#lg)"/>
<g class="ring"><path d="M48 20c-12 0-19 9-19 20v13l-7 9h52l-7-9V40c0-11-7-20-19-20z" fill="#fff"/><circle cx="48" cy="68" r="6" fill="#fff"/></g>
<path d="M58 44l-14 6 5 2 2 6 3-4 4 3z" fill="#6F60F0"/>
<circle cx="72" cy="26" r="10" fill="#FFE6DE" stroke="#fff" stroke-width="3"/><path d="M67.5 26l3 3 5-6" fill="none" stroke="#E36E57" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><clipPath id="c"><rect width="1200" height="320" rx="32"/></clipPath></defs><style>
.blob{animation:drift 11s ease-in-out infinite alternate}.b2{animation-duration:14s;animation-direction:alternate-reverse}.b3{animation-duration:17s}
.bob{animation:bob 3.4s ease-in-out infinite}.d1{animation-delay:-.9s}.d2{animation-delay:-1.8s}.d3{animation-delay:-2.6s}
.walk{stroke-dasharray:3 15;animation:walk 3s linear infinite}
.tw{animation:tw 3.2s ease-in-out infinite}.t2{animation-delay:-1s}.t3{animation-delay:-2s}
.rise{animation:rise .9s ease-out both}.r2{animation-delay:.2s}.r3{animation-delay:.4s}
.ring{transform-box:fill-box;transform-origin:50% 8%;animation:ring 2.8s ease-in-out infinite}
.pop{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-in-out infinite}
@keyframes drift{to{transform:translate(40px,-20px) scale(1.12)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes walk{to{stroke-dashoffset:-54}}
@keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.96)}}
@keyframes ring{0%,55%,100%{transform:rotate(0)}60%{transform:rotate(16deg)}66%{transform:rotate(-14deg)}72%{transform:rotate(10deg)}78%{transform:rotate(-6deg)}84%{transform:rotate(0)}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.25);opacity:.4}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#c)"><rect width="1200" height="320" fill="url(#bg)"/><circle class="blob" cx="150" cy="300" r="130" fill="#FFB4A2" opacity=".32"/><circle class="blob b2" cx="760" cy="30" r="150" fill="#CFC8FF" opacity=".5"/><circle class="blob b3" cx="1120" cy="270" r="140" fill="#A9E3CD" opacity=".45"/><g transform="translate(760 0)"><path class="walk" d="M20 250C90 200 150 270 220 190S330 110 380 60" fill="none" stroke="#6F60F0" stroke-opacity=".4" stroke-width="5" stroke-linecap="round"/><g><path d="M0-9L22 0 0 9 5 0z" fill="#6F60F0"/><path d="M0-9L5 0 0 9" fill="#B3A9FA"/><animateMotion dur="7s" repeatCount="indefinite" rotate="auto" path="M20 250C90 200 150 270 220 190S330 110 380 60"/></g><g transform="translate(42 22)"><g class="bob"><use href="#logo"/></g></g><g class="bob d1"><g class="pop r1"><rect x="24" y="128" width="180" height="46" rx="16" fill="#fff" fill-opacity=".9" stroke="#A9E3CD" stroke-width="2"/><circle class="pulse" cx="40" cy="151" r="5" fill="#A9E3CD"/><text x="54" y="157" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#1F7350" text-anchor="start">3 days left</text></g></g><g class="bob d2"><g class="pop r2"><rect x="180" y="176" width="180" height="46" rx="16" fill="#fff" fill-opacity=".9" stroke="#B3A9FA" stroke-width="2"/><circle class="pulse" cx="196" cy="199" r="5" fill="#B3A9FA"/><text x="210" y="205" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#5548C8" text-anchor="start">Tomorrow!</text></g></g><g class="bob d3"><g class="pop r3"><rect x="70" y="224" width="180" height="46" rx="16" fill="#fff" fill-opacity=".9" stroke="#FFB4A2" stroke-width="2"/><circle class="pulse" cx="86" cy="247" r="5" fill="#FFB4A2"/><text x="100" y="253" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#A8483A" text-anchor="start">3 hours left</text></g></g></g><use class="tw" href="#s" x="700" y="70" fill="#FFB4A2"/><use class="tw t2" href="#s" x="520" y="280" fill="#B3A9FA"/><use class="tw t3" href="#s" x="40" y="40" fill="#A9E3CD"/><g class="rise"><text x="70" y="132" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="800" fill="url(#t)" text-anchor="start">Nudgy</text></g><g class="rise r2"><text x="70" y="182" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#2C2668" text-anchor="start">Your deadlines, right on time.</text><text x="70" y="218" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="400" fill="#7A6B88" text-anchor="start">A bilingual Telegram bot that nudges you before every due date</text></g><g class="rise r3"><rect x="70" y="242" width="83.19999999999999" height="36" rx="18" fill="#FFD5C9"/><text x="111.6" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#A8483A" text-anchor="middle">Python</text><rect x="165.2" y="242" width="185.2" height="36" rx="18" fill="#DAD5FF"/><text x="257.79999999999995" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#5548C8" text-anchor="middle">Telegram Bot API</text><rect x="362.4" y="242" width="83.19999999999999" height="36" rx="18" fill="#D9F3E7"/><text x="404.0" y="266" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#1F7350" text-anchor="middle">SQLite</text></g></g><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>